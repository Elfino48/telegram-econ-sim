<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
      /* FORCE FULL SCREEN & NO SCROLLING */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden; /* This kills the scrollbars */
        background-color: #231F20; 
      }
      
      /* STRETCH CANVAS */
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #231F20;
      }
      
      /* HIDE LOADING BAR (Optional - you can style this later) */
      #unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">Loading...</div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Unity Loader Config
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
      };

      // Load Unity
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          // Show loading progress if you want
        }).then((unityInstance) => {
            // Game Started
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
      
      // Notify Telegram we are ready (expands the window)
      if(window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
      }
    </script>
  </body>
</html>
